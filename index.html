<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KD · Kanallarım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#5E1426;
  --royal:#17307A;
  --ink:#0A1230;
  --gold-hi:#FBEBB5;
  --gold:#D8AE47;
  --gold-lo:#8C6420;
  --text:#F3E7C4;
  --muted:#C9B98C;
  --row:rgba(10,18,48,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --row:rgba(10,18,48,.55); }
}
:root[data-theme="light"],:root[data-theme="dark"]{ --row:rgba(10,18,48,.55); }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(216,174,71,.18), transparent 60%),
    linear-gradient(135deg, var(--maroon) 0%, var(--maroon) 49.8%, var(--royal) 50.2%, var(--royal) 100%);
  background-color:var(--ink);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  font-size:19px; line-height:1.55;
  display:flex; justify-content:center;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(10,18,48,.35), rgba(10,18,48,.75));
}
main{
  position:relative;width:100%;max-width:440px;
  padding:48px 22px 40px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.frame{
  position:relative;width:100%;
  padding:40px 22px 28px;
  border:1px solid rgba(216,174,71,.55);
  outline:1px solid rgba(216,174,71,.22);
  outline-offset:5px;
  border-radius:4px;
  background:linear-gradient(180deg, rgba(10,18,48,.25), rgba(10,18,48,.55));
}
.medal{width:148px;height:148px;margin:-2px auto 22px;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.sheen{animation:sweep 2.4s .4s ease-out 1 both}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
@media (prefers-reduced-motion: reduce){.sheen{animation:none;opacity:0}}
h1{
  font-family:"Cinzel", "Trajan Pro", Georgia, serif;font-weight:700;
  font-size:30px;letter-spacing:.06em;line-height:1.15;margin:0 0 8px;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lede{margin:0 auto 26px;max-width:30ch;color:var(--muted);font-size:19px;font-style:italic}
.rule{display:flex;align-items:center;gap:10px;margin:0 0 22px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rule svg{width:10px;height:10px}
ul{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:12px}
a.ch{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;
  padding:12px 14px 12px 12px;text-decoration:none;color:var(--text);
  background:var(--row);
  border:1px solid rgba(216,174,71,.35);border-radius:4px;
  text-align:left;
  transition:border-color .2s, background .2s, transform .15s;
}
a.ch:hover{border-color:var(--gold);background:rgba(10,18,48,.75)}
a.ch:active{transform:scale(.985)}
a.ch:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ico svg{width:22px;height:22px;fill:var(--ink)}
.who{min-width:0}
.handle{display:block;font-family:"Cinzel",Georgia,serif;font-weight:500;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat{display:block;color:var(--muted);font-size:16px;line-height:1.3}
.cta{
  font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:12.5px;letter-spacing:.04em;
  padding:8px 11px;border-radius:3px;white-space:nowrap;color:var(--ink);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#B8872E);
}
.note{margin:22px 0 0;color:var(--muted);font-size:16px}
footer{margin-top:26px;font-family:"Cinzel",Georgia,serif;font-size:12px;letter-spacing:.2em;color:rgba(216,174,71,.7)}
@media (max-width:360px){ .cta{font-size:11px;padding:7px 8px} a.ch{gap:10px} }
</style>
</head>
